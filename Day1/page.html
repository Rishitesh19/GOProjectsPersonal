<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send to Mac</title><style>
body{font:18px system-ui;max-width:480px;margin:40px auto;padding:24px;background:#f4f6f8;color:#17212b}
form{background:white;padding:24px;border-radius:16px}input{display:block;margin:12px 0 24px;max-width:100%;font:inherit}
button{background:#176b45;color:white;border:0;border-radius:8px;padding:14px 24px;font:inherit}button:disabled{opacity:.5}p{line-height:1.5}
</style><script src="/page.js" defer></script></head><body><h1>Send a file to your Mac</h1>
<p>Your Mac must approve each file. Files on the Mac are never displayed.</p>
<form id="send"><label for="code">Access code from the Mac terminal</label><input id="code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
<label for="file">Choose one file (up to 50 MiB)</label><input id="file" type="file" required>
<button id="submit" type="submit">Request approval</button></form>
<p id="status" role="status" aria-live="polite">Keep this page open during approval and transfer.</p>
<p>Use trusted Wi-Fi. This connection is not encrypted.</p></body></html>
